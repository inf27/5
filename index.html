<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ИНФОРМАТИКА</title><style>
:root{--bg:#f3f6fb;--ink:#182642;--muted:#63738c;--blue:#365cea;--line:#e1e7f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 17px;background:var(--blue);color:white;font-weight:600}button.secondary{background:#eaf0ff;color:#2446b4}button.danger{background:#fff0ed;color:#af3025}button:disabled{opacity:.5;cursor:wait}input,select{width:100%;padding:11px;border:1px solid #ccd5e4;border-radius:9px;background:white;margin:5px 0 14px;color:var(--ink)}input[type=radio],input[type=checkbox]{width:auto;margin:0 12px 0 0}label{display:block}header{background:#fff;border-bottom:1px solid var(--line);padding:18px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:17px;font-weight:800;letter-spacing:.2px}.logo{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--blue);color:white;margin-right:12px}.tag{font-size:12px;background:#edf1ff;color:#3551a5;border-radius:6px;padding:4px 8px}.layout{display:grid;grid-template-columns:225px 1fr;max-width:1450px;margin:auto;min-height:85vh}aside{padding:30px 18px;border-right:1px solid var(--line)}aside button{display:block;width:100%;text-align:left;margin:5px 0;background:transparent;color:var(--muted)}aside button.active{background:#e5ebff;color:#2446b4}main{padding:30px;min-width:0}h1{font-size:29px;line-height:1.25;margin:5px 0 12px}h2{font-size:20px;margin:0 0 16px}h3{font-size:17px}p{margin:8px 0 16px}.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:24px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.stat{font-size:30px;font-weight:750}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.login{max-width:460px;margin:8vh auto}.login .card{padding:35px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--blue);font-weight:750}.notice{padding:12px 16px;border-radius:10px;background:#edf2ff;margin:15px 0}.error{background:#fff0ed;color:#a43125}#status:empty{display:none}#status{position:sticky;top:0;z-index:4}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--muted)}.scroll{overflow:auto}.option{border:1px solid var(--line);padding:12px;border-radius:9px;margin:8px 0;display:flex;align-items:center}.correct{border-left:4px solid #21865d}.wrong{border-left:4px solid #e6a444}pre{white-space:pre-wrap;background:#f4f7fb;padding:16px;border-radius:9px}iframe{width:100%;height:75vh;border:1px solid var(--line);border-radius:10px;background:white}.upload{padding:16px;background:#f7f9fd;border:1px dashed #bdcbe4;border-radius:10px;margin:12px 0}footer{font-size:12px;color:var(--muted);margin-top:30px}dialog{border:1px solid var(--line);border-radius:16px;max-width:650px;width:92%;padding:25px}dialog::backdrop{background:#18264280}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:800px){.layout{display:block}aside{display:flex;overflow:auto;padding:10px;border-right:0}aside button{width:auto;white-space:nowrap}main{padding:18px}.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.brand{font-size:13px}header{padding:14px}.card{padding:18px}}
</style><meta name="referrer" content="strict-origin-when-cross-origin"><script src="./config.js"></script></head><body><header><div class="brand"><span class="logo">&lt;/&gt;</span>NEXT STEP</div><span class="tag">ҰБТ • 11-сынып</span></header><div id="status" role="status"></div><div id="app"></div><dialog id="dialog"><div id="dialogBody"></div><button class="secondary" onclick="document.querySelector('dialog').close()">Жабу</button></dialog><script>
const app=document.getElementById('app');let token=sessionStorage.getItem('ubt-token')||'',data=null,page='lessons',currentTest=null,currentLesson=null,requestId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(message,error=false){document.getElementById('status').innerHTML=message?`<div class="notice ${error?'error':''}">${esc(message)}</div>`:'';}
// A hidden bridge handles cross-origin RPC. Credentials never enter the URL.
let bridgeWindow=null,bridgeOrigin='',bridgeReadyPromise=null,bridgeChannel='',bridgeFailed=false;
const pendingCalls=new Map();
function trustedBridgeOrigin(origin){try{const u=new URL(origin);return u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname==='script.googleusercontent.com'||/^[a-z0-9-]+\.googleusercontent\.com$/.test(u.hostname));}catch(e){return false;}}
function isInsideBridge(source){const frame=document.getElementById('ubtBridge');if(!frame||!source)return false;try{for(let i=0;i<6;i++){if(source===frame.contentWindow)return true;const parent=source.parent;if(parent===source)break;source=parent;}}catch(e){return false;}return false;}
function connectBridge(){
 if(bridgeReadyPromise)return bridgeReadyPromise;
 bridgeReadyPromise=new Promise((resolve,reject)=>{
  const scriptUrl=String(window.UBT_CONFIG?.scriptUrl||'');let url;
  try{url=new URL(scriptUrl);if(url.origin!=='https://script.google.com'||!/^\/macros\/s\/[a-zA-Z0-9_-]+\/exec$/.test(url.pathname))throw Error();}catch(e){reject(Error('Алдымен config.js ішіне Apps Script /exec сілтемесін енгізіңіз.'));return;}
  if(!/^https:\/\/[a-z0-9-]+\.github\.io$/.test(location.origin)){reject(Error('Платформаны жарияланған GitHub Pages сілтемесінен ашыңыз.'));return;}
  bridgeChannel='ubt-'+Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
  url.searchParams.set('channel',bridgeChannel);
  const timer=setTimeout(()=>{bridgeFailed=true;reject(Error('Google қызметімен байланыс орнамады. /exec сілтемесін, GITHUB_ORIGIN баптауын және веб-қосымшаның қолжетімділігін тексеріңіз.'));},30000);
  function listener(event){
   const m=event.data;
   if(!m||m.channel!==bridgeChannel||!trustedBridgeOrigin(event.origin)||!isInsideBridge(event.source))return;
   if(m.type==='UBT_BRIDGE_READY'){
    if(bridgeFailed)return;
    if(bridgeWindow&&(bridgeWindow!==event.source||bridgeOrigin!==event.origin))return;
    bridgeWindow=event.source;bridgeOrigin=event.origin;clearTimeout(timer);
    bridgeWindow.postMessage({type:'UBT_BRIDGE_ACK',channel:bridgeChannel},bridgeOrigin);resolve();return;
   }
   if(m.type!=='UBT_RPC_RESULT'||event.source!==bridgeWindow||event.origin!==bridgeOrigin)return;
   let entry=pendingCalls.get(m.id);if(!entry)return;pendingCalls.delete(m.id);clearTimeout(entry.timer);
   m.ok?entry.resolve(m.value):entry.reject(Error(m.error||'Сұрау орындалмады.'));
  }
  window.addEventListener('message',listener);
  let frame=document.createElement('iframe');frame.id='ubtBridge';frame.title='Деректермен байланыс';frame.hidden=true;frame.setAttribute('aria-hidden','true');frame.src=url.href;document.body.appendChild(frame);
 });return bridgeReadyPromise;
}
async function api(method,...args){
 await connectBridge();return new Promise((resolve,reject)=>{
  let id=crypto.randomUUID();let timer=setTimeout(()=>{pendingCalls.delete(id);reject(Error('Сұрау уақыты аяқталды. Нәтиже сақталған болуы мүмкін: бетті жаңартып тексеріңіз.'));},120000);
  pendingCalls.set(id,{resolve,reject,timer});
  try{bridgeWindow.postMessage({type:'UBT_RPC',channel:bridgeChannel,id,method,args},bridgeOrigin);}catch(e){clearTimeout(timer);pendingCalls.delete(id);reject(e);}
 });
}
async function run(fn){status('Орындалуда…');document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();status('');}catch(e){status(e.message,true);}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
function showLogin(){app.innerHTML=`<section class="login"><div class="card"><p class="eyebrow">Білімге бастайтын қадам</p><h1>Қош келдіңіз!</h1><p class="muted">Сабақтарыңыз, жұмыс дәптеріңіз және үй тесттері — бір кабинетте.</p><form id="loginForm"><label>Логин<input id="login" autocomplete="username" required></label><label>Құпиясөз<input id="password" type="password" autocomplete="current-password" required></label><button style="width:100%">Кабинетке кіру →</button></form><p class="muted" style="font-size:13px;margin-top:18px">Оқушыға кіру деректерін мұғалім береді.</p></div></section>`;document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();run(async()=>{let r=await api('login',document.getElementById('login').value,document.getElementById('password').value);token=r.token;sessionStorage.setItem('ubt-token',token);await refresh();});};}
async function refresh(){data=await api('dashboard',token);render();}
function nav(p){page=p;render();}
function render(){const t=data.user.role==='teacher';app.innerHTML=`<div class="layout"><aside><button class="${page==='lessons'?'active':''}" onclick="nav('lessons')">▦ Сабақтар</button>${t?`<button class="${page==='students'?'active':''}" onclick="nav('students')">♙ Оқушылар</button>`:''}<button class="${page==='results'?'active':''}" onclick="nav('results')">▤ ${t?'Оқушы жұмыстары':'Менің нәтижелерім'}</button><button onclick="signOut()">Шығу</button></aside><main><div class="row"><div><p class="eyebrow">${t?'Мұғалім кабинеті':'Оқушы кабинеті'}</p><h1>${page==='lessons'?'Сабақтар':page==='students'?'Оқушылар':t?'Оқушы жұмыстары':'Менің нәтижелерім'}</h1><p class="muted">${esc(data.user.name)} · ${t?'Аптасына 2 сабақ · 90 минут':esc(data.user.group)}</p></div>${page==='lessons'&&t?'<button onclick="uploadForm()">+ Жаңа сабақ</button>':''}</div><div id="view"></div><footer>Үй тесттері тек өтілген тақырыптардан беріледі. Қатемен жұмыс тест тапсырылғаннан кейін ашылады.</footer></main></div>`;
 if(page==='lessons')lessons(t);else if(page==='students')students();else results();}
function lessons(t){let v=document.getElementById('view');v.innerHTML=`<div class="grid"><div class="card"><span class="muted">${t?'Барлық сабақтар':'Қолжетімді сабақтар'}</span><div class="stat">${data.lessons.length}</div></div><div class="card"><span class="muted">${t?'Оқушылар':'Тапсырылған тесттер'}</span><div class="stat">${t?data.students.length:data.attempts.length}</div></div><div class="card"><span class="muted">Оқу мерзімі</span><div style="font-size:23px;font-weight:700">Сәуір 2027</div></div></div>`;
 if(!data.lessons.length)v.innerHTML+=`<div class="card"><h2>${t?'Алғашқы сабақты қосыңыз':'Сабақтар жақында жарияланады'}</h2><p class="muted">${t?'Мұғалім материалы, жұмыс дәптері және тест — үш HTML файл. Одан кейін сабақты топқа жариялаңыз.':'Мұғалім сіздің тобыңызға сабақ қосқан кезде осы жерде көрінеді.'}</p></div>`;
 data.lessons.slice().reverse().forEach(l=>{v.innerHTML+=`<article class="card"><div class="row"><h2>${esc(l.title)}</h2><span class="tag">${l.published?'Жарияланған':'Жоба'}</span></div><p class="muted">${esc(l.group)} ${l.due?'· Мерзімі: '+esc(new Date(l.due).toLocaleString('kk-KZ')):''}</p><div class="actions">${t?`<button class="secondary" onclick="material('${l.id}','teacher')">Мұғалім материалы</button>`:''}<button class="secondary" onclick="material('${l.id}','workbook')">Жұмыс дәптері</button><button onclick="startTest('${l.id}')">${t?'Тестті қарау':data.attempts.some(a=>a.lessonId===l.id)?'Тестті қайта тапсыру':'Үй тестін орындау'}</button>${t?`<button class="secondary" onclick="toggleLesson('${l.id}')">${l.published?'Жариялауды тоқтату':'Топқа жариялау'}</button><button class="danger" onclick="confirmDelete('lesson','${l.id}')">Тақырыпты жою</button><button class="secondary" onclick="taughtLesson('${l.id}')">${l.taught?'✓ Өтілді (өзгерту)':'Өтілді деп белгілеу'}</button>`:''}</div></article>`;});}
function uploadForm(){document.getElementById('view').innerHTML=`<div class="card"><h2>Жаңа сабақ қосу</h2><form id="uploadForm"><div class="two"><label>Тақырып атауы<input id="title" required maxlength="160"></label><label>Топ атауы<input id="group" value="11-сынып" required></label></div><label>Тест тапсыру мерзімі (міндетті емес)<input id="due" type="datetime-local"></label>${['Мұғалімнің сабақ материалы','Оқушының жұмыс дәптері','ҰБТ форматындағы үй тесті'].map((n,i)=>`<label class="upload">${i+1}. ${n}<input id="file${i}" type="file" accept=".html,.htm" required></label>`).join('')}<p class="muted">Әр файл 1,5 МБ-қа дейін. Тест файлында ubt-test деректері болуы қажет. mode: ubt — 40 тапсырмалық толық тест. Бұрынғы сабақтарды «Өтілді» деп белгілеңіз. topic атаулары сабақ атауларымен дәл сәйкес болсын.</p><button>Үш файлды сақтау</button> <button type="button" class="secondary" onclick="render()">Бас тарту</button></form></div>`;document.getElementById('uploadForm').onsubmit=e=>{e.preventDefault();run(async()=>{let files=[];for(let i=0;i<3;i++){let f=document.getElementById('file'+i).files[0];if(f.size>1500000)throw Error('Файл 1,5 МБ-тан аспасын.');files.push({name:f.name,content:await f.text()});}let due=document.getElementById('due').value;await api('uploadLesson',token,{title:document.getElementById('title').value,group:document.getElementById('group').value,due:due?new Date(due).toISOString():'',files});await refresh();});};}
function taughtLesson(id){run(async()=>{await api('markTaught',token,id);await refresh();});}
function toggleLesson(id){run(async()=>{await api('publishLesson',token,id);await refresh();});}
function material(id,kind){run(async()=>{let html=await api('getMaterial',token,id,kind);const v=document.getElementById('view');v.innerHTML='<button class="secondary" onclick="render()">← Сабақтарға</button><p></p><iframe title="Сабақ материалы" sandbox="allow-scripts"></iframe>';v.querySelector('iframe').srcdoc=html;});}
function students(){document.getElementById('view').innerHTML=`<div class="card"><h2>Оқушы қосу</h2><form id="studentForm"><div class="two"><label>Аты-жөні<input id="sName" required></label><p class="muted">Логин аты-жөнінен автоматты жасалады. Құпиясөз — 6 сан.</p></div><label>Топ<input id="sGroup" value="11-сынып" required></label><button>Оқушыны тіркеу</button></form></div><div class="card scroll"><table><thead><tr><th>Аты-жөні</th><th>Логин</th><th>Топ</th><th>Кіру</th></tr></thead><tbody>${data.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.login)}</td><td>${esc(s.group)}</td><td><button class="secondary" onclick="resetPassword('${s.id}')">Құпиясөзді жаңарту</button> <button class="danger" onclick="confirmDelete('student','${s.id}')">Жою</button></td></tr>`).join('')}</tbody></table></div>`;document.getElementById('studentForm').onsubmit=e=>{e.preventDefault();run(async()=>{let r=await api('addStudent',token,document.getElementById('sName').value,'',document.getElementById('sGroup').value);await refresh();credentials(r);});};}
function confirmDelete(kind,id){
 const student=kind==='student',item=(student?data.students:data.lessons).find(x=>x.id===id);if(!item)return;
 const dialog=document.getElementById('dialog');
 document.getElementById('dialogBody').innerHTML=`<h2>${student?'Оқушыны':'Тақырыпты'} жою керек пе?</h2><p><b>${esc(student?item.name:item.title)}</b></p><p>${student?'Оқушы тізімнен алынады және кабинетке кіре алмайды.':'Тақырып екі кабинеттегі сабақтар тізімінен алынады және ашылмайды.'} Бұрын тапсырылған тест нәтижелері сақталады.</p><p>Жойылған жазбалар мен сабақ файлдары жүйеде мұрағат ретінде қалады.</p><button class="danger" id="confirmDeleteButton">Иә, жою</button><p></p>`;
 document.getElementById('confirmDeleteButton').onclick=()=>{dialog.close();run(async()=>{await api(student?'deleteStudent':'deleteLesson',token,id);await refresh();});};dialog.showModal();
}
function credentials(r){document.getElementById('dialogBody').innerHTML=`<h2>Кіру деректері</h2><p>Құпиясөз бір рет көрсетіледі. Оқушыға жеке беріңіз.</p><pre>Логин: ${esc(r.login)}\nҚұпиясөз: ${esc(r.password)}</pre>`;document.getElementById('dialog').showModal();}
function resetPassword(id){run(async()=>credentials(await api('resetStudent',token,id)));}
function results(){document.getElementById('view').innerHTML=`<div class="card scroll"><div class="row"><h2>Тест нәтижелері</h2><button class="secondary" onclick="downloadCSV()">CSV жүктеу</button></div>${!data.attempts.length?'<p class="muted">Әзірге тапсырылған тест жоқ.</p>':`<table><thead><tr><th>Оқушы</th><th>Тақырып</th><th>Балл</th><th>Пайыз</th><th>Әрекет</th><th>Уақыт</th><th></th></tr></thead><tbody>${data.attempts.slice().reverse().map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.title)}</td><td>${a.score}/${a.max}</td><td>${a.percent}%</td><td>${a.number}</td><td>${esc(new Date(a.at).toLocaleString('kk-KZ'))}</td><td><button class="secondary" onclick="attempt('${a.id}')">Қатемен жұмыс</button></td></tr>`).join('')}</tbody></table>`}</div>`;}
function startTest(id){run(async()=>{currentTest=await api('getTest',token,id);currentLesson=id;requestId=crypto.randomUUID();let t=currentTest;document.getElementById('view').innerHTML=`<div class="card"><button class="secondary" onclick="render()">← Сабақтарға</button><h2 style="margin-top:20px">${esc(t.title)}</h2><p class="muted">Үй тапсырмасы · ${t.questions.length} сұрақ · ${t.mode==='ubt'?'50 балл':'жаттығу'}. Жауаптарды таңдап, соңында тапсырыңыз.</p><div class="notice">Бағалау: біржауапты және контекстік сұрақ — 1 балл; көпжауапты және сәйкестік — 2 балға дейін. Ішінара дұрыс жауаптарға ережеге сәйкес балл беріледі.</div>${t.context?`<pre>${esc(t.context)}</pre>`:''}<form id="testForm">${t.questions.map((q,i)=>`<section class="card"><h3>${i+1}. ${esc(q.text)}</h3>${q.context?`<pre>${esc(q.context)}</pre>`:''}${q.type==='matching'?q.left.map((left,j)=>`<label>${esc(left)}<select name="${esc(q.id)}-${j}"><option value="">Сәйкестігін таңдаңыз</option>${q.options.map((o,k)=>`<option value="${k}">${esc(o)}</option>`).join('')}</select></label>`).join(''):q.options.map((o,k)=>`<label class="option"><input name="${esc(q.id)}" type="${q.type==='multi'?'checkbox':'radio'}" value="${k}"><span>${esc(o)}</span></label>`).join('')}</section>`).join('')}${data.user.role==='student'?'<button>Тестті тапсыру →</button>':'<p class="muted">Бұл — мұғалімнің алдын ала қарауы. Жауаптар оқушы кабинетінде тапсырылады.</p>'}</form></div>`;document.getElementById('testForm').onsubmit=e=>{e.preventDefault();run(async()=>{let f=new FormData(e.target),answers={};t.questions.forEach(q=>{answers[q.id]=q.type==='matching'?q.left.map((_,j)=>f.get(q.id+'-'+j)===''?-1:Number(f.get(q.id+'-'+j))):f.getAll(q.id).map(Number);});let id=await api('submitTest',token,currentLesson,answers,requestId);data=await api('dashboard',token);await showAttempt(id);});};});}
function answerText(q,a){if(q.type==='matching')return q.left.map((l,i)=>l+' → '+(q.options[a[i]]??'Жауап жоқ')).join('\n');return a.map(i=>q.options[i]).join('; ')||'Жауап жоқ';}
async function showAttempt(id){let a=await api('getAttempt',token,id);let lesson=data.lessons.find(l=>l.id===a.lessonId);let canRetake=data.user.role==='student'&&lesson&&(!lesson.due||Date.now()<=new Date(lesson.due).getTime());document.getElementById('view').innerHTML=`<div class="card"><button class="secondary" onclick="nav('results')">← Нәтижелер</button><h2 style="margin-top:20px">${esc(a.title)}</h2><p>${esc(a.name)} · ${a.number}-әрекет</p><div class="stat">${a.score} / ${a.max} <span class="muted">· ${a.percent}%</span></div>${canRetake?`<p><button onclick="startTest('${a.lessonId}')">↻ Тестті қайта тапсыру</button></p><p class="muted">Жаңа әрекет ретінде сақталады. Алдыңғы нәтиже өшірілмейді.</p>`:''}</div><h2>Қатемен жұмыс және жауаптарды талдау</h2>${a.details.map((d,i)=>`<section class="card ${d.points===d.max?'correct':'wrong'}"><h3>${i+1}. ${esc(d.question.text)}</h3>${d.question.context?`<pre>${esc(d.question.context)}</pre>`:''}<p><b>Сіздің жауабыңыз:</b></p><pre>${esc(answerText(d.question,d.answer))}</pre><p><b>Дұрыс жауап:</b></p><pre>${esc(answerText(d.question,d.question.answer))}</pre><p><b>Шығарылу жолы / түсіндірме:</b></p><pre>${esc(d.question.explanation)}</pre><span class="tag">${d.points} / ${d.max} балл</span></section>`).join('')}`;}
function attempt(id){run(()=>showAttempt(id));}
function downloadCSV(){let cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';let rows=[['Оқушы','Тақырып','Балл','Ең жоғары балл','Пайыз','Әрекет','Уақыт'],...data.attempts.map(a=>[a.name,a.title,a.score,a.max,a.percent,a.number,a.at])];let url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='UBT-natizheler.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function signOut(){run(async()=>{await api('logout',token);token='';sessionStorage.removeItem('ubt-token');showLogin();});}
if(token)run(async()=>{try{await refresh();}catch(e){showLogin();throw e;}});else showLogin();
</script></body></html>
