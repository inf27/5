lear-answer:disabled,.test-navigation button:disabled{cursor:default;opacity:.4}.test-type{font-size:12px;color:#6e7e99;margin:0 0 12px}.test-question .test-question-title{font-size:clamp(19px,2.2vw,25px);line-height:1.55;margin:0 0 20px;font-weight:750;overflow-wrap:anywhere}.test-question-title:focus{outline:none}.test-choices{display:grid;gap:10px}.test-choice{position:relative;display:flex;align-items:center;gap:14px;border:1px solid #dbe3f2;border-radius:12px;min-height:60px;padding:12px 16px;cursor:pointer;background:white;transition:background .12s,border-color .12s}.test-choice:hover{background:#f7f9ff;border-color:#a7b9f6}.test-choice.selected{background:#eef3ff;border-color:#3655dc}.test-choice input{position:absolute;opacity:0;width:1px;height:1px;margin:0}.test-choice:focus-within{outline:2px solid #6c8af5;outline-offset:2px}.choice-letter{display:grid;place-items:center;width:33px;height:33px;background:#eef1f7;border-radius:50%;font-weight:700;font-size:13px;flex-shrink:0}.test-choice.selected .choice-letter{background:#3655dc;color:white}.choice-text{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;flex:1}.choice-tick{color:#3655dc;font-weight:750}.test-navigation{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:25px}.previous-question{background:white;color:#29477c;border:1px solid #dbe3f2}.test-context{background:#f4f7fc;border:1px solid #e0e7f2;line-height:1.7;overflow-wrap:anywhere}.matching-pair{border:1px solid #dbe3f2;border-radius:12px;padding:16px;margin-bottom:12px}.matching-pair span{display:block;font-weight:600;margin-bottom:7px}.matching-pair select{margin:0;font-size:15px}@media(max-width:1100px){.test-layout{grid-template-columns:180px minmax(0,1fr);gap:14px}.test-sidebar{padding:15px}.test-question{padding:22px}}@media(max-width:850px){.test-layout{grid-template-columns:1fr}.test-sidebar{position:static;display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}.test-sidebar h2,.test-sidebar .test-legend,.test-sidebar .test-progress,.test-sidebar .finish-test,.test-sidebar .test-save-note{grid-column:1/-1}.test-group{margin:0}.question-numbers{grid-template-columns:repeat(5,minmax(0,1fr))}.question-number{height:34px}.test-sidebar .test-legend{display:flex;flex-wrap:wrap}.test-sidebar .test-progress{margin:5px 0 0;padding-top:10px}.test-sidebar .finish-test{margin-top:4px}.test-question{min-height:0;padding:20px}.test-save-note{margin:0}}@media(max-width:400px){.test-sidebar{gap:10px}.test-question{padding:16px}.test-choice{gap:10px;padding:10px 12px}.test-question-top{gap:8px}.choice-letter{width:30px;height:30px}.test-navigation button{padding:11px 13px;font-size:13px}}

</style><meta name="referrer" content="strict-origin-when-cross-origin"><script src="./config.js"></script></head><body><header><div class="brand"><span class="logo">&lt;/&gt;</span>ИНФОРМАТИКА</div><span class="tag">ҰБТ • 11-сынып</span></header><div id="status" role="status"></div><div id="app"></div><dialog id="dialog"><div id="dialogBody"></div><button class="secondary" onclick="document.querySelector('dialog').close()">Жабу</button></dialog><script>
const app=document.getElementById('app');let token=readSessionToken(),data=null,resultKind='all',page='lessons',currentTest=null,currentLesson=null,requestId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(message,error=false){document.getElementById('status').innerHTML=message?`<div class="notice ${error?'error':''}">${esc(message)}</div>`:'';}
// A hidden bridge handles cross-origin RPC. Credentials never enter the URL.
let bridgeWindow=null,bridgeOrigin='',bridgeReadyPromise=null,bridgeChannel='',bridgeFailed=false;
const pendingCalls=new Map();
function trustedBridgeOrigin(origin){try{const u=new URL(origin);return u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname==='script.googleusercontent.com'||/^[a-z0-9-]+\.googleusercontent\.com$/.test(u.hostname));}catch(e){return false;}}
function isInsideBridge(source){const frame=document.getElementById('ubtBridge');if(!frame||!source)return false;try{for(let i=0;i<6;i++){if(source===frame.contentWindow)return true;const parent=source.parent;if(parent===source)break;source=parent;}}catch(e){return false;}return false;}
function connectBridge(){
 if(bridgeReadyPromise)return bridgeReadyPromise;
 bridgeReadyPromise=new Promise((resolve,reject)=>{
  const scriptUrl=String(window.UBT_CONFIG?.scriptUrl||'');let url;
  try{url=new URL(scriptUrl);if(url.origin!=='https://script.google.com'||!/^\/macros\/s\/[a-zA-Z0-9_-]+\/exec$/.test(url.pathname))throw Error();}catch(e){reject(Error('Алдымен config.js ішіне Apps Script /exec сілтемесін енгізіңіз.'));return;}
  if(!/^https:\/\/[a-z0-9-]+\.github\.io$/.test(location.origin)){reject(Error('Платформаны жарияланған GitHub Pages сілтемесінен ашыңыз.'));return;}
  bridgeChannel='ubt-'+Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
  url.searchParams.set('channel',bridgeChannel);
  const timer=setTimeout(()=>{bridgeFailed=true;reject(Error('Google қызметімен байланыс орнамады. /exec сілтемесін, GITHUB_ORIGIN баптауын және веб-қосымшаның қолжетімділігін тексеріңіз.'));},30000);
  function listener(event){
   const m=event.data;
   if(!m||m.channel!==bridgeChannel||!trustedBridgeOrigin(event.origin)||!isInsideBridge(event.source))return;
   if(m.type==='UBT_BRIDGE_READY'){
    if(bridgeFailed)return;
    if(bridgeWindow&&(bridgeWindow!==event.source||bridgeOrigin!==event.origin))return;
    bridgeWindow=event.source;bridgeOrigin=event.origin;clearTimeout(timer);
    bridgeWindow.postMessage({type:'UBT_BRIDGE_ACK',channel:bridgeChannel},bridgeOrigin);resolve();return;
   }
   if(m.type!=='UBT_RPC_RESULT'||event.source!==bridgeWindow||event.origin!==bridgeOrigin)return;
   let entry=pendingCalls.get(m.id);if(!entry)return;pendingCalls.delete(m.id);clearTimeout(entry.timer);
   m.ok?entry.resolve(m.value):entry.reject(Error(m.error||'Сұрау орындалмады.'));
  }
  window.addEventListener('message',listener);
  let frame=document.createElement('iframe');frame.id='ubtBridge';frame.title='Деректермен байланыс';frame.hidden=true;frame.setAttribute('aria-hidden','true');frame.src=url.href;document.body.appendChild(frame);
 });return bridgeReadyPromise;
}
async function api(method,...args){
 await connectBridge();return new Promise((resolve,reject)=>{
  let id=crypto.randomUUID();let timer=setTimeout(()=>{pendingCalls.delete(id);reject(Error('Сұрау уақыты аяқталды. Нәтиже сақталған болуы мүмкін: бетті жаңартып тексеріңіз.'));},120000);
  pendingCalls.set(id,{resolve,reject,timer});
  try{bridgeWindow.postMessage({type:'UBT_RPC',channel:bridgeChannel,id,method,args},bridgeOrigin);}catch(e){clearTimeout(timer);pendingCalls.delete(id);reject(e);}
 });
}
async function run(fn){status('Орындалуда…');const buttons=Array.from(document.querySelectorAll('button'),b=>[b,b.disabled]);buttons.forEach(([b])=>b.disabled=true);try{await fn();status('');}catch(e){if(/Кіру уақыты аяқталды|Қайта кіріңіз/.test(e.message)){clearSessionToken();token='';data=null;showLogin();}status(e.message,true);}finally{buttons.forEach(([b,disabled])=>{if(b.isConnected)b.disabled=disabled;});}}
function readSessionToken(){
 try{const current=sessionStorage.getItem('ubt-token');if(current)return current;}catch(e){}
 try{const raw=localStorage.getItem('ubt-remembered-session');if(!raw)return '';let saved=JSON.parse(raw);if(typeof saved.token==='string'&&saved.token&&Number.isFinite(saved.expires)&&saved.expires>Date.now())return saved.token;localStorage.removeItem('ubt-remembered-session');}catch(e){try{localStorage.removeItem('ubt-remembered-session');}catch(ignore){}}return '';
}
function clearSessionToken(){try{sessionStorage.removeItem('ubt-token');}catch(e){}try{localStorage.removeItem('ubt-remembered-session');}catch(e){}}
function saveSessionToken(value,expires,remember){
 clearSessionToken();if(remember){try{localStorage.setItem('ubt-remembered-session',JSON.stringify({token:value,expires}));return;}catch(e){}}
 try{sessionStorage.setItem('ubt-token',value);}catch(e){}
}
let transientDeviceSecret='';
function getBrowserDeviceSecret(){
 const valid=value=>typeof value==='string'&&/^[a-f0-9]{64}$/.test(value);
 try{const value=localStorage.getItem('ubt-browser-device');if(valid(value))return value;}catch(e){}
 try{const value=sessionStorage.getItem('ubt-browser-device');if(valid(value))return value;}catch(e){}
 if(!transientDeviceSecret)transientDeviceSecret=Array.from(crypto.getRandomValues(new Uint8Array(32)),x=>x.toString(16).padStart(2,'0')).join('');
 try{localStorage.setItem('ubt-browser-device',transientDeviceSecret);}catch(e){try{sessionStorage.setItem('ubt-browser-device',transientDeviceSecret);}catch(ignore){}}
 return transientDeviceSecret;
}
function showLogin(){app.innerHTML=`<section class="login"><div class="card"><p class="eyebrow">Білімге бастайтын қадам</p><h1>Қош келдіңіз!</h1><p class="muted">Сабақтарыңыз, жұмыс дәптеріңіз және үй тесттері — бір кабинетте.</p><form id="loginForm"><label>Логин<input id="login" autocomplete="username" required></label><label>Құпиясөз<input id="password" type="password" autocomplete="current-password" required></label><label style="display:flex;align-items:center;gap:10px;margin:0 0 18px"><input id="rememberMe" type="checkbox">Мені есте сақтау</label><button style="width:100%">Кабинетке кіру →</button></form><p class="muted" style="font-size:13px;margin-top:18px">Оқушыға кіру деректерін мұғалім береді.</p></div></section>`;document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();run(async()=>{let r=await api('login',document.getElementById('login').value,document.getElementById('password').value,document.getElementById('rememberMe').checked,getBrowserDeviceSecret());token=r.token;saveSessionToken(token,r.expires,r.remembered===true);await refresh();});};}
async function refresh(){data=await api('dashboard',token);render();}
function nav(p){page=p;render();}
function render(){const t=data.user.role==='teacher';app.innerHTML=`<div class="layout"><aside><button class="${page==='lessons'?'active':''}" onclick="nav('lessons')">▦ Сабақтар</button><button onclick="nav('weekly')">Апталық тесттер</button><button onclick="nav('monthly')">Айлық тесттер</button>${t?`<button class="${page==='students'?'active':''}" onclick="nav('students')">♙ Оқушылар</button>`:''}<button class="${page==='results'?'active':''}" onclick="nav('results')">▤ ${t?'Оқушы жұмыстары':'Менің нәтижелерім'}</button><button onclick="signOut()">Шығу</button></aside><main><div class="row"><div><p class="eyebrow">${t?'Мұғалім кабинеті':'Оқушы кабинеті'}</p><h1>${page==='weekly'?'Апталық тесттер':page==='monthly'?'Айлық тесттер':page==='lessons'?'Сабақтар':page==='students'?'Оқушылар':t?'Оқушы жұмыстары':'Менің нәтижелерім'}</h1><p class="muted">${esc(data.user.name)} · ${t?'Аптасына 2 сабақ · 90 минут':esc(data.user.group)}</p></div>${page==='lessons'&&t?'<button onclick="uploadForm()">+ Жаңа сабақ</button>':''}</div><div id="view"></div><footer>Үй тесттері тек өтілген тақырыптардан беріледі. Қатемен жұмыс тест тапсырылғаннан кейін ашылады.</footer></main></div>`;
 if(page==='weekly'||page==='monthly')assessments(t);else if(page==='lessons')lessons(t);else if(page==='students')students();else results();}
function lessonLabel(lesson){return (Number.isInteger(lesson.lessonNumber)?lesson.lessonNumber+'-САБАҚ. ':'')+(lesson.title||'');}
function lessons(t){let v=document.getElementById('view');v.innerHTML=`<div class="grid"><div class="card"><span class="muted">${t?'Барлық сабақтар':'Қолжетімді сабақтар'}</span><div class="stat">${data.lessons.filter(l=>!l.kind||l.kind==='lesson').length}</div></div><div class="card"><span class="muted">${t?'Оқушылар':'Тапсырылған тесттер'}</span><div class="stat">${t?data.students.length:data.attempts.length}</div></div><div class="card"><span class="muted">Оқу мерзімі</span><div style="font-size:23px;font-weight:700">2026-2027 оқу жылы</div></div></div>`;
 if(!data.lessons.length)v.innerHTML+=`<div class="card"><h2>${t?'Алғашқы сабақты қосыңыз':'Сабақтар жақында жарияланады'}</h2><p class="muted">${t?'Мұғалім материалы, жұмыс дәптері және тест — үш HTML файл. Одан кейін сабақты топқа жариялаңыз.':'Мұғалім сіздің тобыңызға сабақ қосқан кезде осы жерде көрінеді.'}</p></div>`;
 data.lessons.filter(l=>!l.kind||l.kind==='lesson').slice().reverse().forEach(l=>{v.innerHTML+=`<article class="card"><div class="row"><h2>${esc(lessonLabel(l))}</h2><span class="tag">${l.published?'Жарияланған':'Жоба'}</span></div><p class="muted">${esc(l.group)} ${l.due?'· Мерзімі: '+esc(new Date(l.due).toLocaleString('kk-KZ')):''}</p><div class="actions">${t?`<button class="secondary" onclick="material('${l.id}','teacher')">Мұғалім материалы</button>`:''}<button class="secondary" onclick="material('${l.id}','workbook')">Жұмыс дәптері</button><button onclick="startTest('${l.id}')">${t?'Тестті қарау':data.attempts.some(a=>a.lessonId===l.id)?'Тестті қайта тапсыру':'Үй тестін орындау'}</button>${t?`<button class="secondary" onclick="toggleLesson('${l.id}')">${l.published?'Жариялауды тоқтату':'Топқа жариялау'}</button><button class="secondary" onclick="editLessonTitle('${l.id}')">Атауын түзету</button><button class="danger" onclick="confirmDelete('lesson','${l.id}')">Тақырыпты жою</button><button class="secondary" onclick="taughtLesson('${l.id}')">${l.taught?'✓ Өтілді (өзгерту)':'Өтілді деп белгілеу'}</button>`:''}</div></article>`;});}
function assessments(teacher){
 const list=data.lessons.filter(l=>l.kind===page);document.getElementById('view').innerHTML=(teacher?'<button onclick="assessmentForm()">+ Тест қосу</button><p></p>':'')+(list.length?list.slice().reverse().map(l=>`<article class="card"><div class="row"><h2>${esc(l.title)}</h2><span class="tag">${l.published?'Жарияланған':'Жоба'}</span></div><p>${esc(l.group)} · ${esc(l.period)}${l.due?' · '+esc(new Date(l.due).toLocaleString('kk-KZ')):''}</p><div class="actions"><button onclick="startTest('${l.id}')">${teacher?'Тестті қарау':data.attempts.some(a=>a.lessonId===l.id)?'Қайта тапсыру':'Тестті орындау'}</button>${teacher?`<button class="secondary" onclick="toggleLesson('${l.id}')">${l.published?'Жариялауды тоқтату':'Жариялау'}</button><button class="secondary" onclick="editLessonTitle('${l.id}')">Атауын түзету</button><button class="danger" onclick="confirmDelete('lesson','${l.id}')">Жою</button>`:''}</div></article>`).join(''):'<div class="card">Әзірге тест жоқ.</div>');

function materialDocumentNavigation(){
 document.addEventListener('click',function(event){
  const target=event.target&&event.target.closest?event.target.closest('a[href]'):null;if(!target)return;
  const href=(target.getAttribute('href')||'').trim();
  if(href.startsWith('#')){
   event.preventDefault();let id;try{id=decodeURIComponent(href.slice(1));}catch(e){id=href.slice(1);}
   if(!id){window.scrollTo({top:0,behavior:'smooth'});return;}
   const section=document.getElementById(id);if(section){section.scrollIntoView({behavior:'smooth',block:'start'});}
   return;
  }
  if(/^https?:\/\//i.test(href)){target.setAttribute('target','_blank');target.setAttribute('rel','noopener noreferrer');}else event.preventDefault();
 },true);
}

let testAnswers={},testIndex=0,testSending=false;

function startTest(id){run(async()=>{data=await api('dashboard',token);currentTest=await api('getTest',token,id);currentLesson=id;requestId=crypto.randomUUID();testAnswers={};testIndex=0;testSending=false;renderTest();});}
function answeredQuestion(q){const a=testAnswers[q.id]||[];return q.type==='matching'?q.left.every((_,i)=>Number.isInteger(a[i])&&a[i]>=0):a.length>0;}
function partialQuestion(q){return q.type==='matching'&&!answeredQuestion(q)&&(testAnswers[q.id]||[]).some(x=>Number.isInteger(x)&&x>=0);}
function renderTest(){
 const t=currentTest,q=t.questions[testIndex],chosen=testAnswers[q.id]||[],teacher=data.user.role==='teacher',count=t.questions.filter(answeredQuestion).length;
 const labels={single:q.context?'Контекст бойынша бір жауап':'Бір дұрыс жауап',multi:'Бір немесе бірнеше дұрыс жауап',matching:'Сәйкестікті анықтау'};
 const groups=[['Жеке сұрақтар',x=>x.type==='single'&&!x.context],['Контекст',x=>x.type==='single'&&x.context],['Сәйкестік',x=>x.type==='matching'],['Көпжауапты',x=>x.type==='multi']];
 const palette=groups.map(([title,filter])=>{const indices=t.questions.map((x,i)=>filter(x)?i:-1).filter(i=>i>=0);if(!indices.length)return '';return `<div class="test-group"><div class="test-group-title">${title}</div><div class="question-numbers">${indices.map(i=>{const item=t.questions[i],done=answeredQuestion(item),active=i===testIndex;return `<button type="button" class="question-number ${done?'answered':''} ${active?'current':''} ${partialQuestion(item)?'partial':''}" aria-label="${i+1}-сұрақ${done?', жауап берілген':''}" ${active?'aria-current="step"':''} onclick="goQuestion(${i})">${i+1}</button>`;}).join('')}</div></div>`;}).join('');
 let options=q.type==='matching'?`<div class="matching-options">${q.left.map((left,j)=>`<label class="matching-pair" for="matching-${j}"><span>${esc(left)}</span><select id="matching-${j}" onchange="chooseMatching(${j},this.value)"><option value="">Сәйкестігін таңдаңыз</option>${q.options.map((o,k)=>`<option value="${k}" ${chosen[j]===k?'selected':''}>${String.fromCharCode(65+k)}. ${esc(o)}</option>`).join('')}</select></label>`).join('')}</div>`:q.options.map((o,k)=>`<label class="test-choice ${chosen.includes(k)?'selected':''}" for="choice-${k}"><input id="choice-${k}" type="${q.type==='multi'?'checkbox':'radio'}" name="test-choice" value="${k}" ${chosen.includes(k)?'checked':''} onchange="chooseTestAnswer(${k})"><span class="choice-letter">${String.fromCharCode(65+k)}</span><span class="choice-text">${esc(o)}</span>${chosen.includes(k)?'<span class="choice-tick" aria-hidden="true">✓</span>':''}</label>`).join('');
 document.getElementById('view').innerHTML=`<div class="test-topline"><button class="secondary" onclick="render()">← Сабақтарға</button><span class="muted">${esc(lessonLabel(t))}</span></div>${teacher?'<div class="notice">Мұғалімнің алдын ала қарауы. Тестті оқушы кабинетінде тапсырады.</div>':''}<div class="test-layout"><section class="test-sidebar"><h2>Информатика</h2>${palette}<div class="test-legend"><span><i class="legend-dot answered"></i>Жауап берілген</span><span><i class="legend-dot current"></i>Ашық сұрақ</span><span><i class="legend-dot partial"></i>Толықтырылмаған сәйкестік</span></div><div class="test-progress"><p id="test-count" aria-live="polite">Барлығы ${count} / ${t.questions.length} жауап</p><progress value="${count}" max="${t.questions.length}" aria-label="Жауап берілген сұрақтар">${count}</progress></div>${teacher?'':`<button class="finish-test" onclick="confirmFinishTest()" ${testSending?'disabled':''}>Тестті аяқтау</button><p class="test-save-note">Алғашқы нәтиже ғана сақталады.</p>`}</section><section class="test-question"><div class="row test-question-top"><span class="test-breadcrumb">Информатика · ${testIndex+1} / ${t.questions.length}</span><button class="clear-answer" onclick="clearTestAnswer()" ${!chosen.some(x=>Number.isInteger(x)&&x>=0)?'disabled':''}>Жауапты өшіру</button></div><p class="test-type">${labels[q.type]}</p>${t.context?`<pre class="test-context">${esc(t.context)}</pre>`:''}${q.context?`<pre class="test-context">${esc(q.context)}</pre>`:''}<h2 class="test-question-title" tabindex="-1" id="questionTitle">${esc(q.text)}</h2><div class="test-choices">${options}</div><div class="test-navigation"><button class="previous-question" onclick="goQuestion(${testIndex-1})" ${testIndex===0?'disabled':''}>← Алдыңғы</button>${testIndex<t.questions.length-1?`<button onclick="goQuestion(${testIndex+1})">Келесі →</button>`:teacher?'<span class="muted">Соңғы сұрақ</span>':'<button onclick="confirmFinishTest()">Тестті аяқтау</button>'}</div></section></div>`;
}
function goQuestion(i){if(testSending||i<0||i>=currentTest.questions.length)return;testIndex=i;renderTest();document.getElementById('questionTitle').focus({preventScroll:true});}
function chooseTestAnswer(option){if(testSending)return;const q=currentTest.questions[testIndex];if(!Number.isInteger(option)||option<0||option>=q.options.length)return;let chosen=testAnswers[q.id]||[];testAnswers[q.id]=q.type==='multi'?(chosen.includes(option)?chosen.filter(i=>i!==option):[...chosen,option]):[option];renderTest();document.getElementById('choice-'+option).focus({preventScroll:true});}
function chooseMatching(pair,value){if(testSending)return;const q=currentTest.questions[testIndex];if(q.type!=='matching'||pair<0||pair>=q.left.length)return;const index=value===''?-1:Number(value);if(index!==-1&&(!Number.isInteger(index)||index<0||index>=q.options.length))return;let chosen=testAnswers[q.id]||q.left.map(()=>-1);chosen[pair]=index;testAnswers[q.id]=chosen;renderTest();document.getElementById('matching-'+pair).focus({preventScroll:true});}
function clearTestAnswer(){if(testSending)return;delete testAnswers[currentTest.questions[testIndex].id];renderTest();}
function confirmFinishTest(){
 if(testSending||data.user.role!=='student')return;const count=currentTest.questions.filter(answeredQuestion).length,missing=currentTest.questions.length-count;
 document.getElementById('dialogBody').innerHTML=`<h2>Тестті аяқтайсыз ба?</h2><p>${count} / ${currentTest.questions.length} сұраққа жауап берілді.</p>${missing?`<div class="notice">${missing} сұрақ толық жауапсыз қалды. Қаласаңыз, тестке оралып толықтырыңыз.</div>`:''}<p>${data.attempts.some(a=>a.lessonId===currentLesson)?'Бұл — қайталау. Нәтиже тек өзіңізге көрсетіледі, алғашқы балл өзгермейді.':'Алғашқы нәтиже мұғалімге сақталады. Тапсырғаннан кейін дұрыс жауаптар мен шешу жолдары ашылады.'}</p><div class="actions"><button id="sendTestButton" onclick="finishTest()">Иә, тестті аяқтау</button></div><p></p>`;document.getElementById('dialog').showModal();
}
function finishTest(){
 if(testSending||data.user.role!=='student')return;testSending=true;document.getElementById('dialog').close();
 run(async()=>{try{let answers={};currentTest.questions.forEach(q=>answers[q.id]=testAnswers[q.id]||(q.type==='matching'?q.left.map(()=>-1):[]));let result=await api('submitTest',token,currentLesson,answers,requestId);data=await api('dashboard',token);if(result&&result.practice)renderAttempt(result.attempt);else await showAttempt(result);}finally{testSending=false;}});
}

function answerText(q,a){if(q.type==='matching')return q.left.map((l,i)=>l+' → '+(q.options[a[i]]??'Жауап жоқ')).join('\n');return a.map(i=>q.options[i]).join('; ')||'Жауап жоқ';}
async function showAttempt(id){let a=await api('getAttempt',token,id);renderAttempt(a);}
function renderAttempt(a){let lesson=data.lessons.find(l=>l.id===a.lessonId);let canRetake=data.user.role==='student'&&lesson&&(!lesson.due||Date.now()<=new Date(lesson.due).getTime());document.getElementById('view').innerHTML=`<div class="card"><button class="secondary" onclick="nav('results')">← Нәтижелер</button><h2 style="margin-top:20px">${esc(lessonLabel(a))}</h2><p>${esc(a.name)} · ${a.practice?'Қайталау жаттығуы':'Алғашқы тапсырған нәтиже'}</p><div class="stat">${a.score} / ${a.max} <span class="muted">· ${a.percent}%</span></div>${canRetake?`<p><button onclick="startTest('${a.lessonId}')">↻ Тестті қайта тапсыру</button></p><p class="muted">Қайталау — өзіңізді тексеруге арналған. Мұғалімде тек алғашқы нәтиже сақталады.</p>`:''}</div>${a.practice?'<div class="notice">Бұл — қайталау нәтижесі. Ол сақталмайды; бетті жапқаннан кейін қайта ашылмайды. Алғашқы тест нәтижесі өзгермейді.</div>':''}<h2>Қатемен жұмыс және жауаптарды талдау</h2>${a.details.map((d,i)=>`<section class="card ${d.points===d.max?'correct':'wrong'}"><h3>${i+1}. ${esc(d.question.text)}</h3>${d.question.context?`<pre>${esc(d.question.context)}</pre>`:''}<p><b>Сіздің жауабыңыз:</b></p><pre>${esc(answerText(d.question,d.answer))}</pre><p><b>Дұрыс жауап:</b></p><pre>${esc(answerText(d.question,d.question.answer))}</pre><p><b>Шығарылу жолы / түсіндірме:</b></p><pre>${esc(d.question.explanation)}</pre><span class="tag">${d.points} / ${d.max} балл</span></section>`).join('')}`;}
function attempt(id){run(()=>showAttempt(id));}
function downloadCSV(){let cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';let rows=[['Оқушы','Тақырып','Балл','Ең жоғары балл','Пайыз','Әрекет','Уақыт'],...data.attempts.map(a=>[a.name,lessonLabel(a),a.score,a.max,a.percent,a.number,a.at])];let url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='UBT-natizheler.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function signOut(){const oldToken=token;clearSessionToken();token='';data=null;showLogin();run(()=>api('logout',oldToken));}
if(token)run(async()=>{try{await refresh();}catch(e){showLogin();throw e;}});else showLogin();
</script></body></html>
